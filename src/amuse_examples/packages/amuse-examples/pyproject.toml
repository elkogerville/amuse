[project]
name = "amuse-examples"
dynamic = ["version"]
requires-python = ">=3.7"
dependencies = [
    "amuse-framework"
]

[build-system]
requires = ["hatchling", "versioningit"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "versioningit"

[tool.versioningit.next-version]
method = "smallest"

[tool.versioningit.format]
distance = "{next_version}.dev{distance}+{vcs}{rev}"
dirty = "{base_version}+d{build_date:%Y%m%d}"
distance-dirty = "{next_version}.dev{distance}+{vcs}{rev}.d{build_date:%Y%m%d}"

[tool.versioningit.vcs]
method = { module = "version_helper", value = "get_amuse_version", module-dir = "amuse_examples/support/shared" }

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
packages = ["amuse_examples/amuse_examples"]
include = ["amuse_examples/amuse_examples/**/*.py"]
exclude = [
    "amuse_examples/packages",
    "amuse_examples/support",
    "amuse_examples/tests"
    ]
artifacts = ["amuse_examples/data/*"]

[tool.pytest.ini_options]
pythonpath = ["amuse_examples/tests/"]

testpaths = ["amuse_examples/tests"]

addopts = "--import-mode=append"    # test the installed package

