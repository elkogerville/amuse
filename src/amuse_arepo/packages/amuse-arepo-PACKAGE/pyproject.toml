[project]
name = "amuse-arepo-PACKAGE"
dynamic = ["version"]
requires-python = ">=3.7"
dependencies = [
    "amuse-framework==2026.3.1.dev61+g005eae22c",
    "amuse-arepo"
]

[build-system]
requires = ["hatchling", "versioningit"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "versioningit"

[tool.versioningit.next-version]
method = "smallest"

[tool.versioningit.format]
distance = "{next_version}.dev{distance}+{vcs}{rev}"
dirty = "{base_version}+d{build_date:%Y%m%d}"
distance-dirty = "{next_version}.dev{distance}+{vcs}{rev}.d{build_date:%Y%m%d}"

[tool.versioningit.vcs]
method = { module = "version_helper", value = "get_amuse_version", module-dir = "amuse_arepo/support/shared" }

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
include = ["amuse_arepo"]
exclude = ["amuse_arepo/*"]
artifacts = ["amuse_arepo/arepo_PACKAGE_worker"]

[tool.pytest.ini_options]
pythonpath = ["amuse_arepo/tests/", "../../../../../tests"]

testpaths = ["amuse_arepo/tests"]

